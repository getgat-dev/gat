version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    commit-message:
      prefix: ":arrow_up:"

  - package-ecosystem: "npm"
    directory: "/docs"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    commit-message:
      prefix: ":arrow_up:"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    commit-message:
      prefix: ":arrow_up:"

  - package-ecosystem: "rust-toolchain"
    directory: "/.github/release-toolchain"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    commit-message:
      prefix: ":arrow_up:"

  - package-ecosystem: "pip"
    directory: "/.github/release-toolchain"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      linux-release-tools:
        patterns: ["*"]
    commit-message:
      prefix: ":arrow_up:"
