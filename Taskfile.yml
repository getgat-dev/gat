version: '3'

tasks:
  build:
    desc: Build the debug binary
    cmds:
      - cargo build

  release:
    desc: Build the optimized release binary
    cmds:
      - cargo build --release --locked

  run:
    desc: Run gat (pass args via -- e.g. `task run -- status`)
    cmds:
      - cargo run --quiet -- {{.CLI_ARGS}}

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting without writing changes
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Lint with clippy, warnings as errors
    cmds:
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  lint:test-hygiene:
    desc: |
      Lightweight source checks: reject unexplained sleeps in test code,
      test-side std::env::set_var/remove_var, and network URLs/fixed
      ports/hardcoded shared paths in every crate's tests and test support.
    cmds:
      - ./tools/check-test-hygiene.sh

  lint:test-hygiene:selftest:
    desc: |
      Regression fixtures for tools/check-test-hygiene.sh itself:
      illegal sleep/env mutation in test-support,
      an allowed sleep-ok: case, and a forbidden network/path case.
    cmds:
      - ./tools/check-test-hygiene.sh --self-test

  lint:error-architecture:
    desc: |
      Guards the error-rendering boundary: fails if a generic
      print_error(Error)-style function or a raw error eprintln! is
      reintroduced anywhere outside output::error::render.
    cmds:
      - ./tools/check-error-architecture.sh

  lint:error-architecture:selftest:
    desc: |
      Regression fixtures for tools/check-error-architecture.sh itself:
      raw error output and print_error fail while typed output passes.
    cmds:
      - ./tools/check-error-architecture.sh --self-test

  lint:workspace-boundary:
    desc: |
      Guards forbidden production dependency directions, root optional
      dependencies, tools default-member isolation, and the engine/command
      source ownership rules Cargo cannot express.
    cmds:
      - ./tools/check-workspace-boundary.sh

  lint:workspace-boundary:selftest:
    desc: |
      Regression fixtures for forbidden dependency directions, root/tool
      manifest policy, and focused engine/command source ownership.
    cmds:
      - ./tools/check-workspace-boundary.sh --self-test

  test:
    desc: Run the test suite (nextest, or cargo test if unavailable)
    cmds:
      - |
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo nextest run --all-features --locked
        else
          cargo test --all-features --locked
        fi

  test:install:
    desc: Test Unix installer checksums and failure recovery with local release fixtures
    cmds:
      - bash tools/check-linux-release.sh --self-test
      - bash tools/test-installers.sh

  test:doc:
    desc: |
      Run doctests (cargo-nextest does not run these): includes the
      compile_fail doctests that enforce presentation and workspace
      API boundaries.
    cmds:
      - cargo test --doc --all-features --locked

  test:stress:
    desc: |
      Repeatedly (a fixed, finite number of times -- not retries baked
      into the ordinary test result) re-run the tests historically
      associated with timing, environment, cache-state, locking, or
      concurrency failures, under normal parallelism, as a regression
      guard for the deterministic fixture architecture.
      Covers: cache/cache-state racy-window tests, lock-process tests
      (lock_integration), environment-interpolation tests, Git-hook
      tests (sync_hooks_integration), merge-driver tests
      (merge_driver_integration), newline tests (newline_integration),
      and the parallel error-ordering test (par_map_ordered). Fails on
      the first iteration that reports any failure.
      Override the iteration count: task test:stress -- 50
    vars:
      ITERATIONS: '{{.CLI_ARGS | default 20}}'
    preconditions:
      - sh: command -v cargo-nextest
        msg: 'Install cargo-nextest to run stress tests: cargo install --locked cargo-nextest'
    cmds:
      - |
        set -eu
        filter='test(racy) or test(stably_old) or test(cache_state) or binary(lock_integration) or binary(merge_driver_integration) or binary(newline_integration) or binary(sync_hooks_integration) or test(par_map_ordered) or test(environment) or test(interpolate)'
        for i in $(seq 1 {{.ITERATIONS}}); do
          echo "=== stress iteration $i/{{.ITERATIONS}} ==="
          cargo nextest run --all-features --locked -E "$filter"
        done

  coverage:
    desc: Run tests under llvm-cov and print a per-file coverage summary
    cmds:
      - cargo llvm-cov nextest --summary-only

  check:
    desc: Run formatting, lint, architecture, installer, unit, integration, and doc checks
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:test-hygiene:selftest
      - task: lint:test-hygiene
      - task: lint:error-architecture:selftest
      - task: lint:error-architecture
      - task: lint:workspace-boundary:selftest
      - task: lint:workspace-boundary
      - task: test:install
      - task: test
      - task: test:doc

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean

  install:
    desc: Install gat to ~/.cargo/bin
    cmds:
      - cargo install --path . --locked --bin gat --force --profile incremental

  install:dev-tools:
    desc: Install gat and all development helper binaries
    cmds:
      - cargo install --path . --locked --bin gat --force --profile incremental
      - cargo install --path tools --locked --bins --force --profile incremental

  docs:generate:
    desc: Regenerate docs/commands/*.mdx, docs/references/configuration.mdx, and docs.json's Commands nav from the CLI
    cmds:
      - cargo run --quiet --locked -p gat-tools --bin generate-docs -- --write

  docs:validate:
    desc: Validate generated docs are current and the Mintlify site is valid
    cmds:
      - cargo run --quiet --locked -p gat-tools --bin generate-docs -- --check
      - npm --prefix docs ci
      - npm --prefix docs run check

  docs:preview:
    desc: Run the Mintlify docs site locally
    env:
      npm_config_loglevel: silent
      NODE_NO_WARNINGS: "1"
    cmds:
      - npm --prefix docs ci
      - npm --prefix docs run dev

  benchmark:generate:
    desc: |
      Generate a tunable benchmark repository (many small files + a few large
      ones) for timing gat's own commands. Defaults to a fresh temp
      directory when --path is omitted. Forwards extra flags, e.g.:
      task benchmark:generate -- --small-files 20000 --large-files 10
    cmds:
      - cargo run --quiet --locked -p gat-tools --bin generate-benchmark -- {{.CLI_ARGS}}
