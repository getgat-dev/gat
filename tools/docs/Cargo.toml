[package]
name = "gat-docs"
edition = "2024"
rust-version = "1.91"
publish = false

[[bin]]
name = "generate-docs"
path = "src/main.rs"

[dependencies]
gat = { path = "../.." }
gat-core = { path = "../../gat-core" }
gat-engine = { path = "../../gat-engine" }
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
